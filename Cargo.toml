[package]
name = "provable-fairness-system"
version = "1.0.0"
edition = "2021"
description = "Provably fair winner selection system on Solana"
license = "MIT"
repository = "https://github.com/Neontoshi/provable-fairness-system"

[lib]
crate-type = ["cdylib", "lib"]
name = "provable_fairness_system"

[dependencies]
anchor-lang = { version = "0.30.1", features = ["init-if-needed"] }
solana-keccak-hasher = "2.2.1"

[dev-dependencies]
anchor-lang = { version = "0.30.1", features = ["init-if-needed", "derive"] }
solana-sdk = "1.18"
solana-program-test = "1.18"
tokio = { version = "1", features = ["full"] }
bincode = "1.3"
serde = "1.0"

[features]
default = []
idl-build = ["anchor-lang/idl-build"]

[profile.release]
overflow-checks = true
lto = true
opt-level = 3
